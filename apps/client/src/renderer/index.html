<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The import map is inline, so it is admitted by hash rather than by
         relaxing script-src to 'unsafe-inline'. Recompute the hash if the
         map changes; scripts/build.mjs verifies it.

         connect-src is widened for the LiveKit room connection: the
         operator's LiveKit URL is a runtime deployment value (fetched
         from the gateway after enrolment), not a build-time constant, so
         it cannot be pinned to a specific origin the way script-src is
         pinned to an exact hash above. Only network destinations are
         broadened, not script execution — see ARCHITECTURE.md § 5.6.

         Remote connections are restricted to wss:/https:, so a candidate's
         video can never be carried to another host in plaintext. Plaintext
         ws:/http: is permitted *only to loopback*, where there is no
         network to intercept — that is what makes a local docker-compose
         LiveKit usable without either weakening the rule for real
         deployments or maintaining a separate development build.

         Note LiveKit also issues an http(s) `/rtc/v1/validate` request
         alongside the WebSocket, so both schemes are needed per host. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-QH+Ho+Y3uV24gUTEbXvIZo+3D26ARzWCb8fPImM1Ox0='; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: https: ws://localhost:* http://localhost:* ws://127.0.0.1:* http://127.0.0.1:*" />
    <title>Exam session</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; display: grid; place-items: center; min-height: 100vh; gap: 1rem; }
      main { display: grid; gap: 1rem; justify-items: center; padding: 2rem; }
      video { width: 320px; border-radius: 8px; background: #111; transform: scaleX(-1); }
      #status { font-size: 0.95rem; }
      #status[data-state="ok"] { color: #1a7f37; }
      #status[data-state="error"] { color: #b91c1c; font-weight: 600; }
      .notice { max-width: 46ch; font-size: 0.85rem; opacity: 0.8; line-height: 1.5; }

      /* -- Consent gate ------------------------------------------------- */
      .consent-overlay {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center; padding: 2rem;
        background: rgba(8, 10, 14, 0.92);
        overflow-y: auto;
      }
      .consent-panel {
        max-width: 62ch; background: Canvas; color: CanvasText;
        border-radius: 12px; padding: 2rem 2.25rem;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        line-height: 1.55;
      }
      .consent-panel h1 { margin: 0 0 1rem; font-size: 1.35rem; }
      .consent-panel ul { padding-left: 1.2rem; margin: 1rem 0; }
      .consent-item { margin-bottom: 0.6rem; }
      .consent-fairness {
        font-size: 0.9rem; opacity: 0.85;
        border-left: 3px solid #6b7280; padding-left: 0.9rem; margin: 1.25rem 0;
      }
      .consent-accept {
        width: 100%; padding: 0.85rem 1rem; font-size: 1rem; font-weight: 600;
        border: 0; border-radius: 8px; cursor: pointer;
        background: #1a7f37; color: #fff;
      }
      .consent-accept:hover { background: #166b2e; }

      /* -- Toasts -------------------------------------------------------- */
      #toasts {
        position: fixed; top: 1rem; right: 1rem; z-index: 200;
        display: flex; flex-direction: column; gap: 0.6rem;
        max-width: 34ch; pointer-events: none;
      }
      .toast {
        display: grid; gap: 0.2rem;
        padding: 0.75rem 0.95rem; border-radius: 10px;
        background: #1f2937; color: #f9fafb;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        border-left: 4px solid #6b7280;
        font-size: 0.9rem; line-height: 1.45;
        animation: toast-in 180ms ease-out;
      }
      .toast strong { font-weight: 600; }
      .toast span { opacity: 0.85; font-size: 0.85rem; }
      .toast-warn { border-left-color: #d97706; }
      .toast-strike { border-left-color: #b91c1c; }
      .toast-leaving { opacity: 0; transition: opacity 240ms ease-in; }
      @keyframes toast-in {
        from { opacity: 0; transform: translateX(12px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .toast { animation: none; }
        .toast-leaving { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Shown to the candidate deliberately. People are entitled to see
           what is being captured of them while it is happening, and a
           visible preview also makes a stalled camera immediately obvious. -->
      <video id="camera" muted playsinline></video>
      <p id="status">Starting…</p>
      <p class="notice">
        Your camera, microphone and screen activity are monitored for the
        duration of this exam. Flags are reviewed by a person before any
        decision is made.
      </p>
    </main>
    <!-- aria-live so a screen reader announces detections as they happen;
         the individual toasts set role=alert only for strikes. -->
    <div id="toasts" aria-live="polite" aria-atomic="false"></div>
    <!-- Loaded over file://, where a bare specifier does not resolve. The
         map keeps the source importing "@mediapipe/tasks-vision" as normal
         while pointing at the vendored bundle at runtime. -->
    <script type="importmap">
      {
        "imports": {
          "@mediapipe/tasks-vision": "./models/vision_bundle.mjs",
          "livekit-client": "./models/livekit-client.mjs"
        }
      }
    </script>
    <script type="module" src="./index.js"></script>
  </body>
</html>
