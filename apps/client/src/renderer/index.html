<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The import map is inline, so it is admitted by hash rather than by
         relaxing script-src to 'unsafe-inline'. Recompute the hash if the
         map changes; scripts/build.mjs verifies it.

         connect-src is widened to wss:/https: for the LiveKit room
         connection: the operator's LiveKit URL is a runtime deployment
         value (fetched from the gateway after enrolment), not a build-time
         constant, so it cannot be pinned to a specific origin the way
         script-src is pinned to an exact hash above. This is a real, if
         narrow, loosening — only network destinations are broadened, not
         script execution — see ARCHITECTURE.md § 5.6. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-QH+Ho+Y3uV24gUTEbXvIZo+3D26ARzWCb8fPImM1Ox0='; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: https:" />
    <title>Exam session</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; display: grid; place-items: center; min-height: 100vh; gap: 1rem; }
      main { display: grid; gap: 1rem; justify-items: center; padding: 2rem; }
      video { width: 320px; border-radius: 8px; background: #111; transform: scaleX(-1); }
      #status { font-size: 0.95rem; }
      #status[data-state="ok"] { color: #1a7f37; }
      #status[data-state="error"] { color: #b91c1c; font-weight: 600; }
      .notice { max-width: 46ch; font-size: 0.85rem; opacity: 0.8; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <!-- Shown to the candidate deliberately. People are entitled to see
           what is being captured of them while it is happening, and a
           visible preview also makes a stalled camera immediately obvious. -->
      <video id="camera" muted playsinline></video>
      <p id="status">Starting…</p>
      <p class="notice">
        Your camera, microphone and screen activity are monitored for the
        duration of this exam. Flags are reviewed by a person before any
        decision is made.
      </p>
    </main>
    <!-- Loaded over file://, where a bare specifier does not resolve. The
         map keeps the source importing "@mediapipe/tasks-vision" as normal
         while pointing at the vendored bundle at runtime. -->
    <script type="importmap">
      {
        "imports": {
          "@mediapipe/tasks-vision": "./models/vision_bundle.mjs",
          "livekit-client": "./models/livekit-client.mjs"
        }
      }
    </script>
    <script type="module" src="./index.js"></script>
  </body>
</html>
