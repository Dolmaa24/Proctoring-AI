# Default exam policy.
#
# Every threshold in this file is a product decision with a human cost, not
# a tuning constant. Loosening `onset_ms` produces more flags, and every
# false flag is a real person accused of cheating on the strength of a
# webcam. The defaults here are deliberately conservative.
#
# Nothing in this policy terminates an exam. `action: flag` means a human
# reviews it. See rules.py::AutomatedAction for why that is the default.

name: default-v1

rules:
  # -- Gaze -----------------------------------------------------------------
  - id: gaze_off_screen
    description: Candidate's gaze left the screen area.
    signal: signal.gaze
    when: { field: on_screen, op: "==", value: false }
    severity: soft
    # 2.5s continuous. Below about 1.5s this fires on people re-reading a
    # question, glancing at a noise, or resting their eyes.
    onset_ms: 2500
    # A blink is 100-400ms and drops iris tracking. Without this hysteresis
    # a candidate could blink their way out of every sustained look-away.
    release_ms: 800
    cooldown_ms: 15000
    min_confidence: 0.6

  - id: gaze_extreme_lateral
    description: Candidate's gaze held far to one side, consistent with reading a second screen.
    signal: signal.gaze
    when: { field: yaw_deg, op: "abs>=", value: 35.0 }
    severity: soft
    onset_ms: 3000
    release_ms: 800
    cooldown_ms: 20000
    min_confidence: 0.65

  # -- Head pose ------------------------------------------------------------
  - id: head_turned_away
    description: Head turned well away from the screen.
    signal: signal.head_pose
    when: { field: yaw_deg, op: "abs>=", value: 40.0 }
    severity: soft
    onset_ms: 3000
    release_ms: 1000
    cooldown_ms: 20000
    min_confidence: 0.6

  - id: head_down_sustained
    description: Head angled down for a sustained period, consistent with looking at a lap or desk.
    signal: signal.head_pose
    when: { field: pitch_deg, op: ">=", value: 35.0 }
    severity: soft
    # Longer than the lateral rules on purpose: candidates legitimately look
    # down at scratch paper, keyboards, and their own hands.
    onset_ms: 5000
    release_ms: 1200
    cooldown_ms: 25000
    min_confidence: 0.6

  # -- Face presence --------------------------------------------------------
  - id: candidate_absent
    description: No face visible; candidate may have left the camera view.
    signal: signal.face
    when: { field: face_count, op: "==", value: 0 }
    severity: hard
    onset_ms: 4000
    release_ms: 1000
    cooldown_ms: 20000
    min_confidence: 0.5

  - id: multiple_faces
    description: More than one face visible in frame.
    signal: signal.face
    when: { field: face_count, op: ">", value: 1 }
    severity: hard
    # 2s rather than instant: a family member walking behind the candidate
    # is common, and the detector also double-counts on some reflections.
    onset_ms: 2000
    release_ms: 1000
    cooldown_ms: 20000
    min_confidence: 0.7

  - id: poor_capture_conditions
    description: Face detection confidence persistently low; session may not be reviewable.
    signal: signal.face
    when: { field: confidence, op: "<", value: 0.45 }
    severity: info
    onset_ms: 10000
    release_ms: 3000
    cooldown_ms: 60000
    # Evaluated on every sample regardless of confidence, because low
    # confidence is precisely what this rule is looking for.
    min_confidence: 0.0
    requires_human_review: false

  # -- Objects --------------------------------------------------------------
  - id: phone_detected
    description: A mobile phone was detected in frame.
    signal: signal.object
    when:
      all_of:
        - { field: label, op: "==", value: phone }
        - { field: confidence, op: ">=", value: 0.7 }
    severity: hard
    # 800ms confirmation window. A single-frame detector false positive must
    # never be enough to accuse someone.
    onset_ms: 800
    release_ms: 1500
    cooldown_ms: 20000
    min_confidence: 0.7

  - id: second_person_detected
    description: A second person was detected in frame.
    signal: signal.object
    when:
      all_of:
        - { field: label, op: "==", value: person }
        - { field: confidence, op: ">=", value: 0.75 }
    severity: hard
    onset_ms: 2000
    release_ms: 1500
    cooldown_ms: 20000
    min_confidence: 0.75

  # INERT: this rule cannot currently fire, and that is a known gap, not
  # an oversight. The bundled detector is EfficientDet-Lite0 over COCO-80,
  # which has no smartwatch class and no headphones class, so no
  # `signal.object` will ever carry these labels. It is kept here because
  # deleting it would erase the intent along with the gap — a reviewer
  # should be able to see what this policy means to cover as well as what
  # it covers today.
  #
  # This is not left to a comment to enforce: DETECTABLE_LABELS /
  # UNDETECTABLE_LABELS in python/proctor_protocol/events.py name the
  # split, and python/tests/test_policy_object_labels.py fails if another
  # inert rule appears, if a rule mixes reachable and unreachable labels,
  # or if this gap closes without the docs following.
  #
  # To make it live: supply a detector trained on these classes, map them
  # in apps/client/src/renderer/objects.ts, and move the labels into
  # DETECTABLE_LABELS. The tests will tell you what else needs updating.
  - id: wearable_detected
    description: A smartwatch or headphones were detected (INERT — see note above).
    signal: signal.object
    when:
      all_of:
        - { field: label, op: "in", value: [smartwatch, headphones] }
        - { field: confidence, op: ">=", value: 0.7 }
    severity: soft
    onset_ms: 1500
    release_ms: 1500
    cooldown_ms: 30000
    min_confidence: 0.7

  # -- Liveness / spoofing --------------------------------------------------
  - id: spoof_suspected
    description: Face appears to be a photograph or a screen rather than a live person.
    signal: signal.liveness
    when: { field: score, op: "<", value: 0.35 }
    severity: hard
    onset_ms: 2000
    release_ms: 2000
    cooldown_ms: 30000
    min_confidence: 0.7

  # -- Audio ----------------------------------------------------------------
  - id: sustained_speech
    description: Sustained speech detected; audio routed for transcription and review.
    signal: signal.audio
    when: { field: speech_active, op: "==", value: true }
    severity: soft
    # 4s. Muttering while thinking is extremely common and is not cheating;
    # this threshold is about catching conversation, not vocalisation.
    onset_ms: 4000
    release_ms: 1500
    cooldown_ms: 20000
    min_confidence: 0.6

  # -- OS environment -------------------------------------------------------
  - id: exam_window_unfocused
    description: The exam window lost focus.
    signal: signal.environment
    when: { field: window_focused, op: "==", value: false }
    severity: hard
    onset_ms: 1000
    release_ms: 500
    cooldown_ms: 10000

  - id: multiple_monitors
    description: More than one display is attached.
    signal: signal.environment
    when: { field: monitor_count, op: ">", value: 1 }
    severity: hard
    onset_ms: 1000
    release_ms: 1000
    cooldown_ms: 60000

  - id: blacklisted_process
    description: A screen-sharing or remote-control process is running.
    signal: signal.environment
    when: { field: blacklisted_processes, op: "!=", value: [] }
    severity: hard
    onset_ms: 1000
    release_ms: 1000
    cooldown_ms: 60000

  - id: screen_share_active
    description: An active screen share was detected.
    signal: signal.environment
    when: { field: screen_share_active, op: "==", value: true }
    severity: hard
    onset_ms: 1000
    release_ms: 1000
    cooldown_ms: 30000

  # -- Frame quality --------------------------------------------------------
  # `soft`, and deliberately so. An unusable camera is overwhelmingly an
  # equipment problem — a cheap webcam, a dim room, a smudged lens — and
  # only rarely deliberate obstruction. This exists so a reviewer can tell
  # "we could not see" apart from "they did something": without it, a
  # blurred frame silently degrades gaze confidence and drops face
  # detections, which reads exactly like a candidate turning away.
  - id: camera_unusable
    description: The camera image is too blurred or obscured to read a face from.
    signal: signal.frame_quality
    when: { field: sharpness, op: "<", value: 0.06 }
    severity: soft
    # 6s. Long, because a hand passing the lens, a moment of refocus, or
    # someone leaning in all blur a frame or two, and none of that is worth
    # telling a reviewer about.
    onset_ms: 6000
    release_ms: 2000
    cooldown_ms: 60000

  # -- Exam shell lockdown --------------------------------------------------
  # Reported per attempt with the running count. The onset is 0 because
  # unlike every other rule here there is nothing probabilistic to confirm:
  # a keystroke either happened or it did not, and a "sustained" keypress
  # is not a meaningful idea.
  #
  # The allowance lives in the rule threshold, not only in the client, so
  # the server reaches its own conclusion about how many attempts occurred.
  # A tampered client that reports `strike: 0` forever still emits one
  # lockdown signal per attempt, and this rule counts the signals.
  - id: lockdown_strikes_exhausted
    description: >-
      The candidate used all their warnings for blocked actions
      (leaving fullscreen, copy/paste, developer tools).
    signal: signal.lockdown
    when: { field: strike, op: ">", value: 3 }
    severity: hard
    # See Rule.discrete: a keystroke is not a detector sample, so there is
    # no confirmation window that would mean anything here.
    discrete: true
    onset_ms: 0
    release_ms: 0
    cooldown_ms: 15000

# Absence-of-data rule. Evaluated on a wall-clock tick, not on receipt of an
# event, so that a client which simply stops reporting still trips it.
liveness:
  id: stream_silent
  description: Telemetry stream went quiet; the client may have been suppressed or crashed.
  max_gap_ms: 5000
  severity: hard
  cooldown_ms: 30000
