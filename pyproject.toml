[project]
name = "proctor"
version = "0.1.0"
description = "Edge-to-cloud automated proctoring platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "python/proctor_protocol",
    "python/proctor_fusion",
    "python/proctor_gateway",
    "python/proctor_sim",
]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
